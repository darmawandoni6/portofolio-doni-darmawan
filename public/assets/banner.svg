<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glow Gradients -->
    <radialGradient id="cyan-glow" cx="15%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigo-glow" cx="88%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple-glow" cx="55%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Linear Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Filter for Shadow & Glow -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.22"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.28"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Monaco, Consolas, monospace; }
    .tag-text { font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px; fill: #38bdf8; }
    .main-title { font-size: 54px; font-weight: 800; fill: url(#title-grad); letter-spacing: -1.2px; }
    .sub-title { font-size: 19px; font-weight: 600; fill: #cbd5e1; }
    .highlight-pill { font-size: 13.5px; font-weight: 600; fill: #f1f5f9; }
    .code-text { font-size: 13px; line-height: 22px; }
    .code-kw { fill: #f472b6; font-weight: 600; }
    .code-var { fill: #38bdf8; }
    .code-prop { fill: #818cf8; }
    .code-str { fill: #34d399; }
    .code-num { fill: #fb923c; }
    .code-comment { fill: #64748b; font-style: italic; }
    .chip-text { font-size: 12px; font-weight: 600; fill: #e2e8f0; }
    .footer-label { font-size: 12px; font-weight: 500; fill: #94a3b8; }
    .footer-value { font-size: 12px; font-weight: 600; fill: #38bdf8; }
  </style>

  <!-- Main Background Container -->
  <rect width="1200" height="627" rx="24" fill="url(#bg-grad)"/>
  
  <!-- Subtle Ambient Glows -->
  <rect width="1200" height="627" rx="24" fill="url(#cyan-glow)"/>
  <rect width="1200" height="627" rx="24" fill="url(#indigo-glow)"/>
  <rect width="1200" height="627" rx="24" fill="url(#purple-glow)"/>

  <!-- Tech Grid Background -->
  <rect width="1200" height="627" rx="24" fill="url(#tech-grid)"/>

  <!-- Modern Outer Border -->
  <rect x="1.5" y="1.5" width="1197" height="624" rx="23" fill="none" stroke="url(#border-grad)" stroke-width="2"/>

  <!-- ================= LEFT COLUMN: HERO IDENTITY ================= -->

  <!-- Status / Pill Badge -->
  <g transform="translate(60, 70)">
    <rect width="265" height="34" rx="17" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="17" cy="17" r="4.5" fill="#10b981" filter="url(#neon-glow)"/>
    <circle cx="17" cy="17" r="2.5" fill="#ffffff"/>
    <text x="34" y="22" class="font-sans tag-text">SOFTWARE ENGINEER • 5+ YRS</text>
  </g>

  <!-- Main Name Title -->
  <text x="60" y="162" class="font-sans main-title">Doni Darmawan</text>

  <!-- Role Subtitle -->
  <g transform="translate(60, 198)">
    <text x="0" y="0" class="font-sans sub-title">
      Frontend &amp; Full-Stack Specialist <tspan fill="#38bdf8">•</tspan> <tspan fill="#ffffff">Next.js &amp; TypeScript</tspan>
    </text>
  </g>

  <!-- Core Highlights / Stats Cards -->
  <g transform="translate(60, 235)">
    <!-- Highlight Card 1: Amartha -->
    <g transform="translate(0, 0)">
      <rect width="475" height="46" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#38bdf8"/>
      <text x="36" y="29" class="font-sans highlight-pill">
        <tspan font-weight="700" fill="#38bdf8">Amartha Microfinance:</tspan> Hybrid WebView &amp; 80%+ Tests
      </text>
    </g>

    <!-- Highlight Card 2: Open Source NPM -->
    <g transform="translate(0, 58)">
      <rect width="475" height="46" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#818cf8"/>
      <text x="36" y="29" class="font-sans highlight-pill">
        <tspan font-weight="700" fill="#818cf8">Open Source Author:</tspan> socketio-kit • template-ui-react
      </text>
    </g>

    <!-- Highlight Card 3: Realtime & Architecture -->
    <g transform="translate(0, 116)">
      <rect width="475" height="46" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#c084fc"/>
      <text x="36" y="29" class="font-sans highlight-pill">
        <tspan font-weight="700" fill="#c084fc">Architecture:</tspan> Turborepo • Real-Time WebChat • Node.js
      </text>
    </g>
  </g>

  <!-- Tech Stack Mini Badges Row -->
  <g transform="translate(60, 428)">
    <!-- Next.js -->
    <g transform="translate(0, 0)">
      <rect width="86" height="30" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="43" y="19" text-anchor="middle" class="font-sans chip-text">Next.js</text>
    </g>
    <!-- React 19 -->
    <g transform="translate(96, 0)">
      <rect width="86" height="30" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="43" y="19" text-anchor="middle" class="font-sans chip-text">React 19</text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(192, 0)">
      <rect width="98" height="30" rx="7" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="49" y="19" text-anchor="middle" class="font-sans chip-text">TypeScript</text>
    </g>
    <!-- Node.js -->
    <g transform="translate(300, 0)">
      <rect width="84" height="30" rx="7" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="42" y="19" text-anchor="middle" class="font-sans chip-text">Node.js</text>
    </g>
    <!-- Socket.IO -->
    <g transform="translate(394, 0)">
      <rect width="81" height="30" rx="7" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
      <text x="40.5" y="19" text-anchor="middle" class="font-sans chip-text">Socket.IO</text>
    </g>
  </g>

  <!-- Bottom Details / Social Links Row -->
  <g transform="translate(60, 488)">
    <rect width="475" height="38" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1"/>
    <!-- GitHub Link -->
    <g transform="translate(16, 0)">
      <circle cx="6" cy="19" r="3" fill="#38bdf8"/>
      <text x="16" y="23" class="font-mono footer-label">github.com/<tspan class="footer-value">darmawandoni6</tspan></text>
    </g>
    <!-- Divider -->
    <line x1="230" y1="10" x2="230" y2="28" stroke="#334155" stroke-width="1"/>
    <!-- LinkedIn Link -->
    <g transform="translate(244, 0)">
      <circle cx="6" cy="19" r="3" fill="#818cf8"/>
      <text x="16" y="23" class="font-mono footer-label">linkedin.com/in/<tspan fill="#818cf8" font-weight="600">doni-darmawan</tspan></text>
    </g>
  </g>


  <!-- ================= RIGHT COLUMN: INTERACTIVE CODE TERMINAL ================= -->

  <g transform="translate(575, 70)" filter="url(#card-shadow)">
    <!-- Terminal Window Container -->
    <rect width="565" height="485" rx="18" fill="#0b1120" fill-opacity="0.95" stroke="#334155" stroke-width="1.2"/>

    <!-- Terminal Header Bar -->
    <rect width="565" height="46" rx="18" fill="#1e293b" fill-opacity="0.8"/>
    <rect y="32" width="565" height="14" fill="#1e293b" fill-opacity="0.8"/>
    <line x1="0" y1="46" x2="565" y2="46" stroke="#334155" stroke-width="1"/>

    <!-- Window Control Buttons (Mac Style) -->
    <circle cx="26" cy="23" r="6.5" fill="#ef4444"/>
    <circle cx="48" cy="23" r="6.5" fill="#f59e0b"/>
    <circle cx="70" cy="23" r="6.5" fill="#10b981"/>

    <!-- Terminal Tab Title -->
    <text x="282" y="28" text-anchor="middle" class="font-mono" font-size="13" font-weight="600" fill="#94a3b8">doni-darmawan.config.ts</text>
    
    <!-- Code Editor Content -->
    <g transform="translate(28, 80)" class="font-mono code-text">
      <!-- Line 1 -->
      <text x="0" y="0">
        <tspan class="code-kw">import</tspan> <tspan class="code-var">{ SoftwareEngineer }</tspan> <tspan class="code-kw">from</tspan> <tspan class="code-str">'@portfolio/core'</tspan><tspan fill="#94a3b8">;</tspan>
      </text>

      <!-- Line 2 -->
      <text x="0" y="28">
        <tspan class="code-kw">export const</tspan> <tspan class="code-var">doni</tspan><tspan fill="#94a3b8">: SoftwareEngineer = {</tspan>
      </text>

      <!-- Line 3 -->
      <text x="20" y="56">
        <tspan class="code-prop">name</tspan><tspan fill="#94a3b8">:</tspan> <tspan class="code-str">'Doni Darmawan'</tspan><tspan fill="#94a3b8">,</tspan>
      </text>

      <!-- Line 4 -->
      <text x="20" y="84">
        <tspan class="code-prop">role</tspan><tspan fill="#94a3b8">:</tspan> <tspan class="code-str">'Software Engineer (5+ Yrs)'</tspan><tspan fill="#94a3b8">,</tspan>
      </text>

      <!-- Line 5 -->
      <text x="20" y="112">
        <tspan class="code-prop">company</tspan><tspan fill="#94a3b8">:</tspan> <tspan class="code-str">'Amartha Microfinance'</tspan><tspan fill="#94a3b8">,</tspan>
      </text>

      <!-- Line 6 -->
      <text x="20" y="140">
        <tspan class="code-prop">specialization</tspan><tspan fill="#94a3b8">: [</tspan><tspan class="code-str">'Next.js'</tspan><tspan fill="#94a3b8">, </tspan><tspan class="code-str">'React 19'</tspan><tspan fill="#94a3b8">, </tspan><tspan class="code-str">'TypeScript'</tspan><tspan fill="#94a3b8">],</tspan>
      </text>

      <!-- Line 7 -->
      <text x="20" y="168">
        <tspan class="code-prop">npmPackages</tspan><tspan fill="#94a3b8">: [</tspan><tspan class="code-str">'socketio-kit'</tspan><tspan fill="#94a3b8">, </tspan><tspan class="code-str">'template-ui-react'</tspan><tspan fill="#94a3b8">],</tspan>
      </text>

      <!-- Line 8 -->
      <text x="20" y="196">
        <tspan class="code-prop">testCoverage</tspan><tspan fill="#94a3b8">:</tspan> <tspan class="code-str">'80%+ Jest Coverage'</tspan><tspan fill="#94a3b8">,</tspan>
      </text>

      <!-- Line 9 -->
      <text x="20" y="224">
        <tspan class="code-prop">status</tspan><tspan fill="#94a3b8">:</tspan> <tspan class="code-str">'Building scalable &amp; high-performance apps 🚀'</tspan>
      </text>

      <!-- Line 10 -->
      <text x="0" y="252">
        <tspan fill="#94a3b8">};</tspan>
      </text>

      <!-- Line 11 (Terminal Output Pill) -->
      <g transform="translate(0, 290)">
        <rect width="509" height="36" rx="8" fill="#020617" fill-opacity="0.9" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="23" font-size="13">
          <tspan fill="#10b981" font-weight="700">✓ </tspan>
          <tspan fill="#94a3b8">Live Portfolio: </tspan>
          <tspan fill="#38bdf8" font-weight="600">https://darmawan.netlify.app</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
